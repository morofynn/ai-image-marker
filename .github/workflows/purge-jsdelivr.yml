name: Refresh jsDelivr main URL

on:
  push:
    branches:
      - main
    paths:
      - ai-image-marker.js

permissions:
  contents: read

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Purge cached main script
        run: |
          curl --fail-with-body --retry 3 --retry-delay 5 \
            "https://purge.jsdelivr.net/gh/morofynn/ai-image-marker@main/ai-image-marker.js"
