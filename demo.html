<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Image Marker – Demo</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #eeeae3; color: #222; font: 16px/1.5 system-ui, sans-serif; }
    main { width: min(1040px, calc(100% - 32px)); margin: 64px auto 120px; }
    h1 { margin-bottom: 8px; font-size: clamp(2rem, 7vw, 5rem); line-height: .95; }
    .intro { max-width: 620px; margin-bottom: 48px; color: #555; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 32px; }
    figure { margin: 0; }
    img { display: block; width: 100%; aspect-ratio: 4/3; object-fit: cover; border-radius: 18px; }
    figcaption { margin-top: 10px; font-size: 13px; color: #666; }
    .clipped { position: relative; overflow: hidden; border-radius: 28px; transform: rotate(-1deg); }
    .clipped img { width: 115%; transform: translateX(-7%); border-radius: 0; }
    .linked { position: relative; display: block; }
    .linked::after { content: 'Bild bleibt anklickbar →'; position: absolute; inset: auto 12px 12px; padding: 6px 9px; border-radius: 99px; background: rgb(0 0 0 / 70%); color: white; font-size: 12px; }
  </style>
  <script src="./ai-image-marker.js" defer></script>
</head>
<body>
  <main>
    <h1>AI Image Marker</h1>
    <p class="intro">Klicke auf einen weißen Punkt. Die Beispiele prüfen normale, verlinkte, transformierte und durch einen Container beschnittene Bilder.</p>
    <section class="grid">
      <figure>
        <img data-ai data-ai-x="25" data-ai-y="75" src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=900&q=80" alt="Berglandschaft">
        <figcaption>Eigene Position: X 25 %, Y 75 %</figcaption>
      </figure>
      <figure>
        <a class="linked" href="https://example.com" target="_blank" rel="noreferrer">
          <img data-ai data-ai-label="Mit KI erstellt" src="https://images.unsplash.com/photo-1493246507139-91e8fad9978e?auto=format&fit=crop&w=900&q=80" alt="See in den Bergen">
        </a>
        <figcaption>Verlinktes Bild mit eigenem Label</figcaption>
      </figure>
      <figure>
        <div class="clipped">
          <img marker="ai" src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=900&q=80" alt="Wald">
        </div>
        <figcaption>Legacy-Attribut marker="ai" in overflow:hidden</figcaption>
      </figure>
    </section>
  </main>
</body>
</html>
